# Build the landing and publish dist/ to the server on every push to main.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# One deploy at a time: a newer push waits for the running one instead of racing it.
concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

env:
  SITE_URL: https://remembr.cc/
  PNPM_VERSION: 12.9.1

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install --global "pnpm@$PNPM_VERSION"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build
        run: pnpm build

      - name: Set up SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
        run: |
          install -d -m 700 ~/.ssh
          (umask 077 && printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key)
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      # On the server the key is locked to rrsync, so "/" means the landing folder itself.
      - name: Upload to the server
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: >-
          rsync --recursive --links --times --perms --compress --delete --itemize-changes
          --chmod=D755,F644
          -e "ssh -i $HOME/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=yes"
          dist/ "$DEPLOY_USER@$DEPLOY_HOST:/"

      - name: Check the home page
        run: |
          status=$(curl --silent --show-error --output served.html --write-out '%{http_code}' "$SITE_URL")
          echo "GET $SITE_URL -> $status"
          test "$status" = 200
          cmp served.html dist/index.html
          echo "The server serves the build of $GITHUB_SHA"
